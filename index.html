<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2540">
<title>yechengzuo · 听见风的地方</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffe9a8' opacity='0.9'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23ffe9a8' stroke-width='1' opacity='0.4'/%3E%3C/svg%3E">
<style>
  :root {
    --text-main: #fff8ee;
    --text-soft: rgba(255, 248, 238, 0.72);
    --text-faint: rgba(255, 248, 238, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    overflow: hidden;
    background: #1a2540; /* 画布渲染前的兜底色 */
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 一层极淡的暗角，让中心文字更聚焦、画面更有呼吸感 */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(10, 14, 30, 0.28) 100%);
  }

  main {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 1.5rem;
    z-index: 2;
  }

  .breathe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(78vw, 520px);
    height: min(78vw, 520px);
    transform: translate(-50%, -50%);
    border: 1px solid rgba(255, 248, 238, 0.16);
    border-radius: 50%;
    animation: breathe 9s ease-in-out infinite;
    pointer-events: none;
  }

  .breathe::after {
    content: "";
    position: absolute;
    inset: 9%;
    border: 1px solid rgba(255, 248, 238, 0.10);
    border-radius: 50%;
    animation: breathe 9s ease-in-out infinite 1.2s;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(0.96); }
    50%      { opacity: 0.9;  transform: translate(-50%, -50%) scale(1.06); }
  }

  h1 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 5.5vw, 3.6rem);
    letter-spacing: 0.14em;
    color: var(--text-main);
    text-shadow: 0 2px 24px rgba(20, 30, 60, 0.35), 0 0 60px rgba(255, 233, 168, 0.18);
    line-height: 1.7;
    user-select: text;
    cursor: default;
  }

  h1 .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.6em);
    animation: riseIn 1.1s cubic-bezier(0.22, 0.8, 0.3, 1) forwards;
  }

  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .subline {
    margin-top: 2rem;
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    color: var(--text-soft);
    letter-spacing: 0.3em;
    opacity: 0;
    animation: fadeIn 2s ease 1.6s forwards;
  }

  .clock {
    margin-top: 1.1rem;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-variant-numeric: tabular-nums;
    color: var(--text-soft);
    letter-spacing: 0.22em;
    opacity: 0;
    animation: fadeIn 2s ease 2.1s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  footer {
    position: fixed;
    bottom: 2.2rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.82rem;
    letter-spacing: 0.28em;
    color: var(--text-faint);
    z-index: 2;
    opacity: 0;
    animation: fadeIn 2.5s ease 2.8s forwards;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .breathe, .breathe::after { animation: none; opacity: 0.5; }
    h1 .char, .subline, .clock, footer { animation-duration: 0.01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="vignette"></div>
<main>
  <div class="breathe"></div>
  <h1 id="title">你好，我是 yechengzuo。</h1>
  <p class="subline" id="subline"></p>
  <p class="clock" id="clock"></p>
</main>
<footer>这里什么都没有 · 只有风和光 · 慢慢呼吸</footer>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");
  const titleEl = document.getElementById("title");
  const sublineEl = document.getElementById("subline");
  const clockEl = document.getElementById("clock");

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isCoarse = window.matchMedia("(pointer: coarse)").matches;

  let W = 0, H = 0, dpr = 1;

  /* ---------- 逐字浮现标题 ---------- */
  const rawTitle = titleEl.textContent.trim();
  if (!reducedMotion) {
    titleEl.textContent = "";
    const chars = Array.from(rawTitle);
    chars.forEach(function (ch, i) {
      const span = document.createElement("span");
      span.className = "char";
      span.textContent = ch === " " ? "\u00A0" : ch;
      span.style.animationDelay = (0.25 + i * 0.09) + "s";
      titleEl.appendChild(span);
    });
  }

  /* ---------- 随时间变化的天空 ----------
     每个关键帧：[小时, 顶部色, 底部色, 夜色系数] */
  const SKY_KEYFRAMES = [
    { h: 0,   top: [10, 18, 40],  bottom: [36, 52, 88],   night: 1.00 },
    { h: 5,   top: [40, 54, 94],  bottom: [244, 164, 138], night: 0.55 },
    { h: 8,   top: [110, 168, 210], bottom: [252, 240, 222], night: 0.10 },
    { h: 13,  top: [98, 160, 208], bottom: [253, 244, 228], night: 0.05 },
    { h: 17,  top: [58, 66, 112], bottom: [246, 168, 124], night: 0.35 },
    { h: 20,  top: [24, 36, 66],  bottom: [96, 80, 150],  night: 0.75 },
    { h: 23.5, top: [10, 18, 40], bottom: [36, 52, 88],   night: 1.00 }
  ];

  function lerp(a, b, t) { return a + (b - a) * t; }

  function sampleSky(hour) {
    const lastKf = SKY_KEYFRAMES[SKY_KEYFRAMES.length - 1];
    if (hour >= lastKf.h) {
      return { top: lastKf.top.slice(), bottom: lastKf.bottom.slice(), night: lastKf.night };
    }
    let a = SKY_KEYFRAMES[0], b = lastKf;
    for (let i = 0; i < SKY_KEYFRAMES.length - 1; i++) {
      const k0 = SKY_KEYFRAMES[i], k1 = SKY_KEYFRAMES[i + 1];
      if (hour >= k0.h && hour <= k1.h) { a = k0; b = k1; break; }
    }
    const span = b.h - a.h;
    const t = span === 0 ? 0 : (hour - a.h) / span;
    return {
      top: [lerp(a.top[0], b.top[0], t), lerp(a.top[1], b.top[1], t), lerp(a.top[2], b.top[2], t)],
      bottom: [lerp(a.bottom[0], b.bottom[0], t), lerp(a.bottom[1], b.bottom[1], t), lerp(a.bottom[2], b.bottom[2], t)],
      night: lerp(a.night, b.night, t)
    };
  }

  let sky = sampleSky(new Date().getHours() + new Date().getMinutes() / 60);
  let skyTarget = sky;

  /* ---------- 星子与萤火 ---------- */
  const starCount = isCoarse ? 70 : 130;
  const fireflyCount = isCoarse ? 18 : (reducedMotion ? 12 : 38);

  const stars = [];
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.55,
      r: 0.4 + Math.random() * 1.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 1.6
    });
  }

  const fireflies = [];
  for (let i = 0; i < fireflyCount; i++) {
    fireflies.push({
      x: Math.random(),
      y: 0.25 + Math.random() * 0.7,
      vx: 0, vy: 0,
      r: 1.2 + Math.random() * 2.4,
      phase: Math.random() * Math.PI * 2,
      warm: Math.random() < 0.75,   // 暖黄光 / 淡绿光
      glow: 0.5 + Math.random() * 0.5
    });
  }

  const pointer = { x: -9999, y: -9999, active: false };

  window.addEventListener("pointermove", function (e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  });
  window.addEventListener("pointerleave", function () {
    pointer.active = false;
  });

  /* 点击：泛起一圈柔光涟漪 + 几点微光 */
  const ripples = [];
  window.addEventListener("pointerdown", function (e) {
    if (reducedMotion) return;
    ripples.push({ x: e.clientX, y: e.clientY, r: 4, alpha: 0.55, life: 1 });
    for (let i = 0; i < 6; i++) {
      const ang = Math.random() * Math.PI * 2;
      ripples.push({
        x: e.clientX, y: e.clientY,
        vx: Math.cos(ang) * (14 + Math.random() * 26),
        vy: Math.sin(ang) * (14 + Math.random() * 26),
        r: 1 + Math.random() * 2,
        alpha: 0.8,
        life: 1
      });
    }
  });

  /* 流星：夜里偶尔划过（单位均为秒） */
  let meteor = null;
  let nextMeteor = 6 + Math.random() * 12;

  function spawnMeteor() {
    meteor = {
      x: Math.random() * 0.6 + 0.1,
      y: Math.random() * 0.3,
      vx: 0.16 + Math.random() * 0.12,   // 以屏幕宽度为比例的速度
      vy: 0.05 + Math.random() * 0.04,
      alpha: 1
    };
  }

  /* ---------- 尺寸适配 ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  /* ---------- 问候语与时钟 ---------- */
  function greetingFor(h) {
    if (h < 5)  return "夜深了";
    if (h < 8)  return "清晨好";
    if (h < 11) return "上午好";
    if (h < 13) return "中午好";
    if (h < 17) return "午后好";
    if (h < 19) return "傍晚好";
    return "晚上好";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const week = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
    sublineEl.textContent = greetingFor(h) + "，欢迎来到这片小天地。";
    clockEl.textContent =
      pad(h) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds()) +
      " · " + (now.getMonth() + 1) + "月" + now.getDate() + "日 星期" + week;
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ---------- 渲染 ---------- */
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgb(" + sky.top.join(",") + ")");
    g.addColorStop(1, "rgb(" + sky.bottom.join(",") + ")");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars(t) {
    if (sky.night < 0.06) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      const a = sky.night * tw * 0.85;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,250,235," + a.toFixed(3) + ")";
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFireflies(t, dt) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];

      if (!reducedMotion) {
        /* 缓缓游荡：极慢的正弦漂移 + 轻微上浮（速度单位：屏幕宽高/秒） */
        const desVx = Math.sin(t * 0.12 + f.phase) * 0.006;
        const desVy = Math.cos(t * 0.10 + f.phase * 1.7) * 0.006 - 0.002;
        const follow = Math.min(1, dt * 2.5);
        f.vx += (desVx - f.vx) * follow;
        f.vy += (desVy - f.vy) * follow;

        /* 指尖轻轻推开（直接位移，避免速度积累） */
        const dx = f.x * W - pointer.x;
        const dy = f.y * H - pointer.y;
        const d2 = dx * dx + dy * dy;
        if (pointer.active && d2 < 160 * 160 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const repel = Math.pow(1 - d / 160, 2) * 0.02 * dt;
          f.x += (dx / d) * repel;
          f.y += (dy / d) * repel;
        }

        f.x += f.vx * dt;
        f.y += f.vy * dt;

        if (f.x < -0.03) f.x = 1.03; else if (f.x > 1.03) f.x = -0.03;
        if (f.y < 0.15) { f.y = 0.15; f.vy = Math.abs(f.vy) * 0.4; }
        if (f.y > 1.03) { f.y = 1.03; f.vy = -Math.abs(f.vy) * 0.4; }
      }

      const pulse = 0.5 + 0.5 * Math.sin(t * 0.9 + f.phase * 2.1);
      const alpha = (0.18 + 0.5 * pulse) * f.glow * (0.55 + sky.night * 0.45);
      const color = f.warm ? "255, 231, 160" : "205, 255, 178";

      const g = ctx.createRadialGradient(f.x * W, f.y * H, 0, f.x * W, f.y * H, f.r * 7);
      g.addColorStop(0, "rgba(" + color + "," + alpha.toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + color + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(f.x * W, f.y * H, f.r * 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMeteor(t, dt) {
    if (!meteor && t > nextMeteor) {
      if (sky.night > 0.4 && !reducedMotion) spawnMeteor();
      nextMeteor = t + 8 + Math.random() * 15;
    }
    if (!meteor) return;
    meteor.x += meteor.vx * dt;
    meteor.y += meteor.vy * dt;
    meteor.alpha -= 0.8 * dt;
    if (meteor.alpha <= 0 || meteor.x > 1.1 || meteor.y > 0.7) {
      meteor = null;
      return;
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const x = meteor.x * W, y = meteor.y * H;
    const len = 0.12 * W;
    const tailX = x - meteor.vx * len * 14;
    const tailY = y - meteor.vy * len * 14;
    const g = ctx.createLinearGradient(x, y, tailX, tailY);
    g.addColorStop(0, "rgba(255,255,255," + (meteor.alpha * 0.9).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();
    ctx.restore();
  }

  function drawRipples(dt) {
    if (ripples.length === 0) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= 0.9 * dt;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      if (r.vx !== undefined) {
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        r.vx *= 0.94;
        r.vy *= 0.94;
      } else {
        r.r += 55 * dt;
      }
      const a = r.life * r.alpha;
      ctx.beginPath();
      ctx.arc(r.x, r.y, Math.max(r.r, 0.5), 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,240,200," + a.toFixed(3) + ")";
      ctx.fill();
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;

    /* 天空颜色缓慢向当前时间的目标色靠近 */
    const hour = new Date().getHours() + new Date().getMinutes() / 60;
    skyTarget = sampleSky(hour);
    const k = 1 - Math.pow(0.02, dt);   // 平滑跟随，约一秒内完成过渡
    sky.top = [
      lerp(sky.top[0], skyTarget.top[0], k),
      lerp(sky.top[1], skyTarget.top[1], k),
      lerp(sky.top[2], skyTarget.top[2], k)
    ];
    sky.bottom = [
      lerp(sky.bottom[0], skyTarget.bottom[0], k),
      lerp(sky.bottom[1], skyTarget.bottom[1], k),
      lerp(sky.bottom[2], skyTarget.bottom[2], k)
    ];
    sky.night = lerp(sky.night, skyTarget.night, k);

    drawSky();
    drawStars(t);
    drawMeteor(t, dt);
    drawFireflies(t, dt);
    drawRipples(dt);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
