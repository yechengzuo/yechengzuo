<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>吉他 · Neon Guitar</title>
<style>
  :root { --cyan: #00f0ff; --magenta: #ff2ec4; --yellow: #ffe14d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background-color: #05060f;
    background-image:
      linear-gradient(rgba(0,240,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.05) 1px, transparent 1px),
      radial-gradient(900px 520px at 20% -10%, rgba(20,40,120,.5), transparent 60%),
      radial-gradient(900px 520px at 110% 115%, rgba(120,20,90,.45), transparent 60%);
    background-size: 46px 46px, 46px 46px, auto, auto;
    color: #dff8ff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
  .back { position: fixed; top: 18px; left: 18px; z-index: 6; padding: 8px 16px; font-size: 14px; letter-spacing: .12em;
    color: #bffcff; text-decoration: none; border: 1px solid rgba(0,240,255,.6); background: rgba(0,240,255,.08);
    text-shadow: 0 0 8px rgba(0,240,255,.7); transition: all .25s ease; }
  .back:hover { color: #fff; background: rgba(0,240,255,.18); box-shadow: 0 0 18px rgba(0,240,255,.5); }
  main { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 1rem; }
  .kicker { font-size: .78rem; letter-spacing: .5em; text-indent: .5em; color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,.6); margin-bottom: .7rem; }
  h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); letter-spacing: .2em; text-indent: .2em; color: #fff;
    text-shadow: 0 0 10px rgba(0,240,255,.95), 0 0 34px rgba(0,240,255,.55), 3px 0 0 rgba(255,46,196,.5); }
  .sub { margin-top: .6rem; font-size: .82rem; letter-spacing: .22em; text-indent: .22em; color: rgba(160,225,255,.9); }

  .chord-name { margin-top: 1.3rem; font-size: 1.5rem; font-weight: 800; letter-spacing: .1em; color: var(--yellow); text-shadow: 0 0 14px rgba(255,225,77,.7); min-height: 2rem; }
  .neck { position: relative; width: 220px; height: 300px; margin: .9rem auto 0; background: rgba(20,30,50,.55); border: 1px solid rgba(0,240,255,.35); border-radius: 8px; }
  .neck .fret { position: absolute; left: 0; right: 0; height: 1px; background: rgba(140,200,255,.18); }
  .neck .string { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(180,220,255,.3); }
  .neck .dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.9); transform: translate(-50%, -50%); }
  .chips { display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; max-width: 560px; margin-top: 1.3rem; }
  .chip { min-width: 74px; padding: .8rem .6rem; border-radius: 8px; cursor: pointer; text-align: center;
    border: 1px solid rgba(0,240,255,.45); background: rgba(0,240,255,.06); transition: all .15s ease; }
  .chip:hover { background: rgba(0,240,255,.14); box-shadow: 0 0 14px rgba(0,240,255,.4); }
  .chip:active { transform: translateY(1px); }
  .chip .cn { display: block; font-size: 1.15rem; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(0,240,255,.7); }
  .chip .kb { display: block; margin-top: .35rem; font-family: Consolas, monospace; font-size: .85rem; color: var(--magenta); text-shadow: 0 0 8px rgba(255,46,196,.7); }
  .chip.pending { outline: 2px solid var(--yellow); box-shadow: 0 0 22px rgba(255,225,77,.8); }

  .controls { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; margin-top: 1.5rem; }
  .ctl { padding: .55rem 1.3rem; font-size: .9rem; letter-spacing: .12em; color: #bffcff; border: 1px solid rgba(0,240,255,.5);
    background: rgba(0,240,255,.06); cursor: pointer; border-radius: 4px; transition: all .2s ease; }
  .ctl:hover { background: rgba(0,240,255,.15); box-shadow: 0 0 14px rgba(0,240,255,.45); }
  .ctl.on { color: #fff; background: rgba(255,46,196,.2); border-color: var(--magenta); box-shadow: 0 0 16px rgba(255,46,196,.6); }
  .legend { margin-top: 1rem; font-family: Consolas, monospace; font-size: .76rem; letter-spacing: .08em; color: rgba(150,225,255,.85); line-height: 1.8; max-width: 92vw; }
  footer { position: fixed; bottom: 1.3rem; left: 0; right: 0; z-index: 3; text-align: center; font-size: .7rem;
    letter-spacing: .24em; text-indent: .24em; color: rgba(170,225,255,.75); }
  @media (max-width: 860px) { footer { display: none; } }
</style>
</head>
<body>
<div class="scanlines"></div>
<a class="back" href="music.html">← 返回乐器</a>
<main>
  <p class="kicker">NEON GUITAR</p>
  <h1>吉他</h1>
  <p class="sub">点击和弦或按对应键盘键扫弦</p>

  <div class="chord-name" id="chordName">·</div>
  <div class="neck" id="neck"></div>
  <div class="chips" id="chips"></div>

  <div class="controls">
    <button class="ctl" id="remap">⌨ 改键位</button>
    <button class="ctl" id="demo">♫ 试听</button>
  </div>
  <p class="legend" id="legend"></p>
</main>
<footer>© 2026 YECHENGZUO · PLAY THE NEON</footer>

<script>
(() => {
  'use strict';

  const STRINGS = [40, 45, 50, 55, 59, 64];   // E A D G B e
  const CHORDS = {
    C:  [-1,3,2,0,1,0], G: [3,2,0,0,0,3], Am: [-1,0,2,2,1,0], F: [1,3,3,2,1,1],
    Em: [-1,2,2,0,0,0], Dm: [-1,-1,0,2,3,1], E: [-1,2,2,1,0,0], D: [-1,-1,0,2,3,2],
  };
  const ORDER = ['C','G','Am','F','Em','Dm','E','D'];
  const DEFAULT = { C:'Z', G:'X', Am:'C', F:'V', Em:'B', Dm:'N', E:'M', D:',' };
  const KEY = 'bindings-guitar';

  function load() { try { const b = JSON.parse(localStorage.getItem(KEY) || '{}'); const o = Object.assign({}, DEFAULT); for (const k in b) o[k] = b[k]; return o; } catch (e) { return Object.assign({}, DEFAULT); } }
  let bindings = load();
  function save() { localStorage.setItem(KEY, JSON.stringify(bindings)); }

  let remapMode = false, pending = null;
  let actx = null, master = null, delay = null, delayGain = null;

  function audioInit() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);
    delay = actx.createDelay(1); delay.delayTime.value = 0.28;
    delayGain = actx.createGain(); delayGain.gain.value = 0.3;
    master.connect(delay); delay.connect(delayGain); delayGain.connect(delay); delayGain.connect(actx.destination);
  }

  function pluck(midi, t) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const o = actx.createOscillator(), g = actx.createGain(), flt = actx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f;
    flt.type = 'lowpass'; flt.frequency.value = 1600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(flt); flt.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.55);
  }

  function strum(ch) {
    audioInit();
    CHORDS[ch].forEach((fr, i) => { if (fr >= 0) pluck(STRINGS[i] + fr, actx.currentTime + i * 0.035); });
    document.getElementById('chordName').textContent = ch;
    drawDots(ch);
  }

  const neck = document.getElementById('neck');
  for (let f = 0; f <= 4; f++) {
    const d = document.createElement('div'); d.className = 'fret';
    d.style.top = (20 + f * 65) + 'px'; neck.appendChild(d);
  }
  for (let s = 0; s < 6; s++) {
    const d = document.createElement('div'); d.className = 'string';
    d.style.left = (22 + s * 36) + 'px'; neck.appendChild(d);
  }

  function drawDots(ch) {
    neck.querySelectorAll('.dot').forEach(d => d.remove());
    CHORDS[ch].forEach((fr, s) => {
      if (fr < 0) return;
      const dot = document.createElement('div'); dot.className = 'dot';
      dot.style.left = (22 + s * 36) + 'px';
      dot.style.top = (20 + fr * 65) + 'px';
      neck.appendChild(dot);
    });
  }

  function render() {
    const chips = document.getElementById('chips');
    chips.innerHTML = '';
    ORDER.forEach(ch => {
      const el = document.createElement('div');
      el.className = 'chip'; el.dataset.chord = ch;
      el.innerHTML = '<span class="cn">' + ch + '</span><span class="kb">' + (bindings[ch] || '?') + '</span>';
      el.addEventListener('pointerdown', () => {
        if (remapMode) { pending = ch; document.querySelectorAll('.pending').forEach(e => e.classList.remove('pending')); el.classList.add('pending'); updateLegend(); return; }
        strum(ch);
      });
      chips.appendChild(el);
    });
    updateLegend();
  }

  function updateLegend() {
    const l = document.getElementById('legend');
    l.textContent = remapMode
      ? (pending ? '已选中「' + pending + '」和弦，请按新键位（Esc 取消）' : '点击一个和弦，再按新键位（Esc 退出）')
      : '和弦 Z X C V B N M , · 依次对应 C G Am F Em Dm E D';
  }

  const remapBtn = document.getElementById('remap');
  remapBtn.addEventListener('click', () => { remapMode = !remapMode; pending = null; remapBtn.classList.toggle('on', remapMode); updateLegend(); });

  document.getElementById('demo').addEventListener('click', () => {
    ['C','G','Am','F','C','G','F','C'].forEach((ch, i) => setTimeout(() => strum(ch), i * 520));
  });

  function keyToChord(key) { for (const id of Object.keys(bindings)) if (bindings[id] === key) return id; return null; }

  window.addEventListener('keydown', e => {
    if (e.code === 'Escape') { remapMode = false; pending = null; remapBtn.classList.remove('on'); updateLegend(); return; }
    if (remapMode) {
      const key = e.key.toUpperCase();
      if (key.length !== 1 || !pending) return;
      bindings[pending] = key; save();
      const id = pending; pending = null;
      render();
      document.getElementById('legend').textContent = '已保存：' + id + ' → ' + key;
      return;
    }
    const key = e.key.toUpperCase();
    if (e.repeat || key.length !== 1) return;
    const ch = keyToChord(key);
    if (ch) { e.preventDefault(); strum(ch); }
  });

  render();
})();
</script>
</body>
</html>
